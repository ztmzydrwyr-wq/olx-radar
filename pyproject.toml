[project]
name = "olx-monitor"
version = "0.1.0"
description = "Мониторинг новых объявлений olx.ua с уведомлениями в Telegram"
requires-python = ">=3.11"
dependencies = [
    # Без подмены TLS-отпечатка CloudFront отдаёт 403 на любой запрос к olx.ua.
    # Это не оптимизация, а условие работы — см. docs/pipeline/spikes/FINDINGS.md, S-01+02.
    "curl_cffi>=0.7.4",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "aiogram>=3.15",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
